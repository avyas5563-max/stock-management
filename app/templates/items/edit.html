{% extends "base.html" %}

{% block title %}Edit Item{% endblock %}
{% block page_title %}Edit Item{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5><i class="bi bi-pencil"></i> Edit Item</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('items.edit_item', item_id=item.item_id) }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="item_name" class="form-label">Item Name *</label>
                                <input type="text" class="form-control" id="item_name" name="item_name" value="{{ item.item_name }}" required autofocus>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="category_id" class="form-label">Category *</label>
                                <select class="form-select" id="category_id" name="category_id" required>
                                    {% for category in categories %}
                                    <option value="{{ category.category_id }}" {% if category.category_id == item.category_id %}selected{% endif %}>
                                        {{ category.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="unit" class="form-label">Unit *</label>
                                <input type="text" class="form-control" id="unit" name="unit" value="{{ item.unit }}" placeholder="e.g., kg, pcs, bags, ltr" required>
                                <small class="text-muted">Measurement unit</small>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="min_stock" class="form-label">Minimum Stock Level *</label>
                                <input type="number" step="0.01" class="form-control" id="min_stock" name="min_stock" value="{{ item.min_stock }}" placeholder="Minimum quantity" required>
                                <small class="text-muted">Alert when stock goes below this</small>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="purchase_price" class="form-label">Purchase Price (₹) *</label>
                                <input type="number" step="0.01" class="form-control" id="purchase_price" name="purchase_price" value="{{ item.purchase_price }}" placeholder="0.00" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="sale_price" class="form-label">Sale Price (₹) *</label>
                                <input type="number" step="0.01" class="form-control" id="sale_price" name="sale_price" value="{{ item.sale_price }}" placeholder="0.00" required>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('items.list_items') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle"></i> Update Item
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
